# Despliegue en Render (Blueprint). Render lee este archivo al conectar el repositorio.
services:
  - type: web
    name: prediccion-vivienda-bogota
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
